{% extends "base.html" %}

{% block title %}Set New Password | Customer Account | {{ brand_name }}{% endblock %}

{% block content %}
<div class="container" style="padding: 4rem 1rem 6rem;">

  <div style="max-width: 460px; margin: 0 auto; background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 2.75rem 2.25rem; box-shadow: var(--shadow-sm);">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <span class="section-tag">Account Security</span>
      <h1 style="font-size: 1.85rem; margin-bottom: 0.4rem;">Set New Password</h1>
      <p style="color: var(--text-muted); font-size: 0.875rem;">Create a strong, secure password with at least 8 characters.</p>
    </div>

    <form method="POST" action="{{ url_for('account.reset_password', token=token) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label for="password" style="font-size: 0.875rem; font-weight: 600;">New Password</label>
        <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" class="form-control" placeholder="At least 8 characters">
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label for="confirm_password" style="font-size: 0.875rem; font-weight: 600;">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required minlength="8" autocomplete="new-password" class="form-control" placeholder="Repeat new password">
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem; font-size: 0.9375rem;">
        Update Password &rarr;
      </button>

      <div style="margin-top: 1.75rem; padding-top: 1.5rem; border-top: 1px solid var(--border-light); text-align: center; font-size: 0.875rem; color: var(--text-muted);">
        Cancel and return to 
        <a href="{{ url_for('account.login') }}" style="color: var(--gold-dark); font-weight: 600; text-decoration: none;">
          Sign In
        </a>
      </div>
    </form>

  </div>

</div>
{% endblock %}
