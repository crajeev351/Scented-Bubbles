{% extends "admin/base.html" %}

{% block page_title %}Edit Page: {{ page.title }}{% endblock %}

{% block content %}
<div style="max-width: 800px; margin: 0 auto;">

  <div class="admin-header-row" style="margin-bottom: 2rem;">
    <h2 style="font-size: 1.5rem; margin: 0;">Edit Page Content: {{ page.title }}</h2>
    <a href="{{ url_for('admin.page_list') }}" class="btn btn-secondary btn-sm">&larr; Back to Pages</a>
  </div>

  <form method="POST" class="admin-card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-group">
      <label for="title">Page Title *</label>
      <input type="text" id="title" name="title" value="{{ page.title }}" required class="form-control">
    </div>

    <div class="form-group">
      <label for="slug">Page URL Slug (Fixed)</label>
      <input type="text" id="slug" value="{{ page.slug }}" disabled class="form-control" style="background: var(--bg-subtle);">
    </div>

    <div class="form-group">
      <label for="content">Page Body Content (HTML supported) *</label>
      <textarea id="content" name="content" rows="12" required class="form-control" style="font-family: monospace; font-size: 0.875rem; line-height: 1.5;">{{ page.content }}</textarea>
    </div>

    <div style="margin: 1.5rem 0;">
      <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
        <input type="checkbox" name="is_active" value="1" {{ 'checked' if page.is_active else '' }}>
        <strong>Page Active &amp; Published</strong>
      </label>
    </div>

    <div style="margin-top: 2rem; display: flex; gap: 1rem;">
      <button type="submit" class="btn btn-primary" style="padding: 0.85rem 2rem;">Save Page</button>
      <a href="{{ url_for('admin.page_list') }}" class="btn btn-secondary" style="padding: 0.85rem 1.5rem;">Cancel</a>
    </div>

  </form>

</div>
{% endblock %}
