{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="container" style="padding: 5rem 0; text-align: center;">
  <div style="max-width: 520px; margin: 0 auto; background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 3.5rem 2rem; box-shadow: var(--shadow-sm);">
    <span class="section-tag">404 Error</span>
    <h1 style="font-size: 2.4rem; margin: 0.5rem 0 1rem;">Fragrance Not Found</h1>
    <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem;">
      The page or blend you are seeking may have been renamed, archived, or is currently unavailable.
    </p>
    <a href="{{ url_for('products.product_list') }}" class="btn btn-primary">Return to Catalog</a>
  </div>
</div>
{% endblock %}
