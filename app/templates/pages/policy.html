{% extends "base.html" %}

{% block title %}{{ page.title }}{% endblock %}

{% block content %}
<div class="container" style="padding-top: 3rem; padding-bottom: 5rem;">

  <div style="max-width: 800px; margin: 0 auto; background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 3rem 2.5rem; box-shadow: var(--shadow-sm);">
    
    <div style="text-align: center; margin-bottom: 2.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border-light);">
      <span class="section-tag">{{ brand_name }} Legal &amp; Policies</span>
      <h1 style="font-size: 2.2rem; margin-top: 0.4rem;">{{ page.title }}</h1>
      <span style="font-size: 0.8125rem; color: var(--text-light);">Last updated: {{ (page.updated_at | ist).strftime('%B %d, %Y') }}</span>
    </div>

    <div style="font-size: 0.95rem; line-height: 1.8; color: #3C3834;">
      {{ page.content | safe }}
    </div>

  </div>

</div>
{% endblock %}
